<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitNotes PRO - Diario de Ejercicios</title>
    <!-- Configuración para PWA / App Móvil -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FitNotes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white pb-20">
    <div>
        <header class="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/80 backdrop-filter backdrop-blur-md px-4 py-3 sm:px-8">
            <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
                        <i class="fa-solid fa-dumbbell text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
                            FitNotes <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PRO</span>
                        </h1>
                        <p class="text-xs text-slate-400">Diario de Ejercicios y Tiempos de Descanso</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-4 w-full sm:w-auto justify-between sm:justify-end">
                    <button id="toggleTimerPanelBtn" onclick="toggleTimerModal()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-medium border border-slate-700 transition-all">
                        <i class="fa-solid fa-stopwatch text-emerald-400"></i>
                        <span>Reloj / Temporizador</span>
                        <span id="activeTimerBadge" class="hidden ml-1 px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded-md text-[10px]">00:00</span>
                    </button>
                    <button onclick="openModal()" class="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-emerald-500/20 active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nuevo Ejercicio</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 sm:px-8 space-y-6">
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 glass-panel p-4 rounded-2xl flex flex-wrap sm:flex-nowrap gap-3 items-center">
                    <div class="relative flex-1 min-w-[200px]">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="searchInput" oninput="renderExercises()" placeholder="Buscar ejercicio..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 transition-all">
                    </div>
                    <select id="categoryFilter" onchange="renderExercises()" class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="all">Todas las Categorías</option>
                        <option value="Superior">Tren Superior</option>
                        <option value="Brazos">Brazos</option>
                        <option value="Inferior">Tren Inferior</option>
                        <option value="Core">Core / Abdomen</option>
                        <option value="Cardio">Cardio / Movilidad</option>
                    </select>
                    <button onclick="resetCheckboxes()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl px-3 py-2 flex items-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-rotate-left"></i> Reiniciar Checkbox
                    </button>
                </div>

                <div class="glass-panel p-4 rounded-2xl flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-bold tracking-wider text-slate-400 uppercase block">ACCESO RÁPIDO</span>
                        <h3 class="text-sm font-semibold text-slate-200">Temporizador de Descanso</h3>
                    </div>
                    <div class="flex gap-1.5">
                        <button onclick="startQuickTimer(30)" class="bg-slate-800 hover:bg-emerald-500/20 hover:text-emerald-400 hover:border-emerald-500/40 border border-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg transition-all font-mono">30s</button>
                        <button onclick="startQuickTimer(60)" class="bg-slate-800 hover:bg-emerald-500/20 hover:text-emerald-400 hover:border-emerald-500/40 border border-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg transition-all font-mono">60s</button>
                        <button onclick="startQuickTimer(90)" class="bg-slate-800 hover:bg-emerald-500/20 hover:text-emerald-400 hover:border-emerald-500/40 border border-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg transition-all font-mono">90s</button>
                    </div>
                </div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-emerald-400"></i>
                        <span>Mis Ejercicios & Rutinas</span>
                    </h2>
                    <span id="exerciseCounter" class="text-xs font-medium text-slate-400 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full">0 ejercicios</span>
                </div>
                <div id="exerciseList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </section>
        </main>
    </div>

    <!-- Banner Flotante de Instalación -->
    <div id="pwaInstallBanner" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900/95 border border-emerald-500/40 p-4 rounded-2xl shadow-2xl z-50 hidden flex items-center justify-between gap-3 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-xl">
                <i class="fa-solid fa-download text-lg"></i>
            </div>
            <div>
                <h4 class="text-xs font-bold text-white">Instalar FitNotes PRO</h4>
                <p id="pwaInstallDesc" class="text-[11px] text-slate-400">Descarga la app en tu teléfono</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button id="pwaInstallBtn" onclick="triggerPwaInstall()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold px-3 py-2 rounded-xl transition-all whitespace-nowrap">
                Descargar
            </button>
            <button onclick="closeInstallBanner()" class="text-slate-500 hover:text-slate-300 p-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Modales y Paneles -->
    <div id="exerciseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 shadow-2xl relative border border-slate-700/60 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Agregar Nuevo Ejercicio</h3>
            <form id="exerciseForm" onsubmit="saveExercise(event)" class="space-y-4">
                <input type="hidden" id="exerciseId">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre del Ejercicio *</label>
                    <input type="text" id="title" required placeholder="Ej: Press de Banca, Sentadillas..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Categoría</label>
                        <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Superior">Tren Superior</option>
                            <option value="Brazos">Brazos</option>
                            <option value="Inferior">Tren Inferior</option>
                            <option value="Core">Core / Abdomen</option>
                            <option value="Cardio">Cardio / Movilidad</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Series</label>
                        <input type="number" id="sets" min="1" max="10" value="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Repeticiones / Tiempo</label>
                        <input type="text" id="reps" placeholder="Ej: 10-12 reps o 45 seg" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Peso / Carga Objetivo</label>
                        <input type="text" id="weight" placeholder="Ej: 50 kg o Corporal" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Imagen del Ejercicio</label>
                    <div class="space-y-2">
                        <input type="file" id="imageFileInput" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
                        <div class="text-center text-[10px] text-slate-500 font-semibold uppercase">O URL de Imagen Externa</div>
                        <input type="url" id="imageUrlInput" placeholder="https://ejemplo.com/imagen.jpg" oninput="handleUrlInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <input type="hidden" id="imageData">
                    <div id="imagePreviewContainer" class="mt-2 hidden">
                        <img id="imagePreview" src="" class="w-full h-32 object-cover rounded-xl border border-slate-700">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Notas / Técnica / Indicaciones</label>
                    <textarea id="notes" rows="2" placeholder="Mantener la espalda recta, codos a 45 grados..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold rounded-xl text-xs transition-all">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Panel Modal de Reloj y Temporizador -->
    <div id="timerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-6 shadow-2xl relative border border-slate-700/60 text-center">
            <button onclick="toggleTimerModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-base font-bold text-white mb-4 flex items-center justify-center gap-2">
                <i class="fa-solid fa-stopwatch text-emerald-400"></i> Control de Tiempo
            </h3>
            <div class="flex justify-center gap-2 mb-4 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTimerTab('timer')" id="tabTimerBtn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 text-slate-950">Temporizador</button>
                <button onclick="switchTimerTab('stopwatch')" id="tabStopwatchBtn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400">Cronómetro</button>
            </div>
            
            <div id="timerSection" class="space-y-4">
                <div class="text-4xl font-mono font-extrabold tracking-wider text-emerald-400 my-2" id="timerDisplay">01:00</div>
                <div class="flex justify-center gap-2">
                    <button onclick="setTimerSeconds(30)" class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300 hover:border-emerald-500">30s</button>
                    <button onclick="setTimerSeconds(60)" class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300 hover:border-emerald-500">60s</button>
                    <button onclick="setTimerSeconds(90)" class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300 hover:border-emerald-500">90s</button>
                    <button onclick="setTimerSeconds(120)" class="px-2.5 py-1 bg-slate-800 border border-slate-700 text-xs rounded-lg text-slate-300 hover:border-emerald-500">2m</button>
                </div>
                <div class="flex justify-center gap-3 pt-2">
                    <button id="startTimerBtn" onclick="toggleTimer()" class="bg-emerald-500 text-slate-950 font-bold px-5 py-2 rounded-xl text-xs hover:bg-emerald-400">Iniciar</button>
                    <button onclick="resetTimer()" class="bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl text-xs hover:bg-slate-700">Reiniciar</button>
                </div>
            </div>

            <div id="stopwatchSection" class="space-y-4 hidden">
                <div class="text-4xl font-mono font-extrabold tracking-wider text-emerald-400 my-2" id="stopwatchDisplay">00:00:00</div>
                <div class="flex justify-center gap-3 pt-2">
                    <button id="startStopwatchBtn" onclick="toggleStopwatch()" class="bg-emerald-500 text-slate-950 font-bold px-5 py-2 rounded-xl text-xs hover:bg-emerald-400">Iniciar</button>
                    <button onclick="resetStopwatch()" class="bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl text-xs hover:bg-slate-700">Reiniciar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let exercises = JSON.parse(localStorage.getItem('fitnotes_exercises')) || [];
        let timerInterval = null, timerTimeLeft = 60, isTimerRunning = false;
        let stopwatchInterval = null, stopwatchTime = 0, isStopwatchRunning = false;
        let deferredPrompt = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (exercises.length === 0) {
                exercises = [{
                    id: '1',
                    title: 'Movilidad',
                    category: 'Cardio',
                    sets: 4,
                    reps: '12',
                    weight: 'Sin Peso',
                    notes: 'Calentamiento de articulaciones',
                    imageData: 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=600&auto=format&fit=crop',
                    completedSets: [true, true, true, false]
                }];
                saveToStorage();
            }
            renderExercises();
            updateTimerDisplay();
            checkPwaInstallation();
        });

        // Lógica de Detección e Instalación de PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const banner = document.getElementById('pwaInstallBanner');
            if (banner) banner.classList.remove('hidden');
        });

        function checkPwaInstallation() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (isStandalone) return;

            if (isIos) {
                const banner = document.getElementById('pwaInstallBanner');
                const desc = document.getElementById('pwaInstallDesc');
                const btn = document.getElementById('pwaInstallBtn');
                if (banner && desc && btn) {
                    desc.innerText = 'Toca Compartir ⎋ y "Agregar al inicio"';
                    btn.innerText = '¿Cómo instalar?';
                    btn.onclick = () => alert('Para instalar en iPhone:\n1. Toca el botón de Compartir en Safari (icono de cuadrado con flecha).\n2. Desliza hacia abajo y selecciona "Agregar a la pantalla de inicio".');
                    banner.classList.remove('hidden');
                }
            }
        }

        function triggerPwaInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        closeInstallBanner();
                    }
                    deferredPrompt = null;
                });
            }
        }

        function closeInstallBanner() {
            document.getElementById('pwaInstallBanner').classList.add('hidden');
        }

        function saveToStorage() { localStorage.setItem('fitnotes_exercises', JSON.stringify(exercises)); }

        function renderExercises() {
            const container = document.getElementById('exerciseList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const filtered = exercises.filter(ex => {
                const matchesSearch = ex.title.toLowerCase().includes(search) || (ex.notes && ex.notes.toLowerCase().includes(search));
                const matchesCategory = category === 'all' || ex.category === category;
                return matchesSearch && matchesCategory;
            });

            document.getElementById('exerciseCounter').innerText = `${filtered.length} ejercicio${filtered.length !== 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 glass-panel rounded-2xl"><i class="fa-solid fa-folder-open text-3xl text-slate-600 mb-2"></i><p class="text-slate-400 text-sm">No se encontraron ejercicios</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(ex => `
                <div class="glass-panel rounded-2xl overflow-hidden flex flex-col justify-between border border-slate-800 hover:border-slate-700 transition-all group">
                    <div>
                        ${ex.imageData ? `<div class="relative h-44 w-full overflow-hidden bg-slate-900"><img src="${ex.imageData}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"><div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent"></div></div>` : ''}
                        <div class="p-4 ${ex.imageData ? '-mt-10 relative z-10' : ''}">
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-800/90 text-slate-300 border border-slate-700/80 uppercase">${ex.category}</span>
                                <div class="flex gap-1 bg-slate-900/80 p-1 rounded-lg border border-slate-800">
                                    <button onclick="editExercise('${ex.id}')" class="text-slate-400 hover:text-emerald-400 p-1 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteExercise('${ex.id}')" class="text-slate-400 hover:text-rose-400 p-1 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                            <h3 class="font-bold text-slate-100 text-base mb-2">${ex.title}</h3>
                            <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                                <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block font-semibold">Series x Reps</span><span class="font-bold text-slate-200">${ex.sets} × ${ex.reps || '-'}</span></div>
                                <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block font-semibold">Carga / Peso</span><span class="font-bold text-slate-200">${ex.weight || 'Sin peso'}</span></div>
                            </div>
                            ${ex.notes ? `<p class="text-xs text-slate-400 line-clamp-2 bg-slate-900/40 p-2 rounded-lg border border-slate-800/50 mb-3"><i class="fa-solid fa-quote-left text-[10px] text-emerald-500/50 mr-1"></i>${ex.notes}</p>` : ''}
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1.5">
                            <span>MARCAR SERIES REALIZADAS</span>
                            <button onclick="startQuickTimer(60)" class="text-emerald-400 hover:underline text-[10px]"><i class="fa-solid fa-stopwatch"></i> Descanso</button>
                        </div>
                        <div class="grid grid-cols-${Math.min(ex.sets, 5)} gap-1.5">
                            ${Array.from({length: ex.sets}).map((_, i) => `
                                <button onclick="toggleSet('${ex.id}',${i})" class="py-1.5 rounded-lg text-xs font-mono font-bold transition-all flex items-center justify-center gap-1 ${ex.completedSets && ex.completedSets[i] ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-900 text-slate-500 border border-slate-800 hover:border-slate-700'}">
                                    <i class="fa-solid ${ex.completedSets && ex.completedSets[i] ? 'fa-circle-check' : 'fa-circle'} text-[10px]"></i> S${i+1}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleSet(exerciseId, setIndex) {
            const ex = exercises.find(e => e.id === exerciseId);
            if (!ex) return;
            if (!ex.completedSets) ex.completedSets = new Array(ex.sets).fill(false);
            ex.completedSets[setIndex] = !ex.completedSets[setIndex];
            saveToStorage();
            renderExercises();
        }

        function resetCheckboxes() {
            exercises.forEach(ex => { ex.completedSets = new Array(ex.sets).fill(false); });
            saveToStorage();
            renderExercises();
        }

        function openModal(editId = null) {
            document.getElementById('exerciseForm').reset();
            document.getElementById('exerciseId').value = '';
            document.getElementById('imageData').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
            document.getElementById('modalTitle').innerText = 'Agregar Nuevo Ejercicio';

            if (editId) {
                const ex = exercises.find(e => e.id === editId);
                if (ex) {
                    document.getElementById('exerciseId').value = ex.id;
                    document.getElementById('title').value = ex.title;
                    document.getElementById('category').value = ex.category;
                    document.getElementById('sets').value = ex.sets;
                    document.getElementById('reps').value = ex.reps || '';
                    document.getElementById('weight').value = ex.weight || '';
                    document.getElementById('notes').value = ex.notes || '';
                    if (ex.imageData) {
                        document.getElementById('imageData').value = ex.imageData;
                        document.getElementById('imagePreview').src = ex.imageData;
                        document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    }
                    document.getElementById('modalTitle').innerText = 'Editar Ejercicio';
                }
            }
            document.getElementById('exerciseModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('exerciseModal').classList.add('hidden'); }

        function saveExercise(e) {
            e.preventDefault();
            const id = document.getElementById('exerciseId').value || Date.now().toString();
            const setsCount = parseInt(document.getElementById('sets').value) || 1;
            const existingEx = exercises.find(ex => ex.id === id);

            const exerciseData = {
                id: id,
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                sets: setsCount,
                reps: document.getElementById('reps').value,
                weight: document.getElementById('weight').value,
                notes: document.getElementById('notes').value,
                imageData: document.getElementById('imageData').value,
                completedSets: existingEx && existingEx.completedSets ? existingEx.completedSets.slice(0, setsCount) : new Array(setsCount).fill(false)
            };

            if (existingEx) {
                const index = exercises.findIndex(ex => ex.id === id);
                exercises[index] = exerciseData;
            } else {
                exercises.unshift(exerciseData);
            }

            saveToStorage();
            renderExercises();
            closeModal();
        }

        function editExercise(id) { openModal(id); }

        function deleteExercise(id) {
            if (confirm('¿Seguro que deseas eliminar este ejercicio?')) {
                exercises = exercises.filter(ex => ex.id !== id);
                saveToStorage();
                renderExercises();
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('imageData').value = evt.target.result;
                    document.getElementById('imagePreview').src = evt.target.result;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    document.getElementById('imageUrlInput').value = '';
                };
                reader.readAsDataURL(file);
            }
        }

        function handleUrlInput() {
            const url = document.getElementById('imageUrlInput').value;
            if (url) {
                document.getElementById('imageData').value = url;
                document.getElementById('imagePreview').src = url;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }
        }

        function toggleTimerModal() { document.getElementById('timerModal').classList.toggle('hidden'); }
        function switchTimerTab(tab) {
            if (tab === 'timer') {
                document.getElementById('timerSection').classList.remove('hidden');
                document.getElementById('stopwatchSection').classList.add('hidden');
                document.getElementById('tabTimerBtn').className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 text-slate-950';
                document.getElementById('tabStopwatchBtn').className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400';
            } else {
                document.getElementById('timerSection').classList.add('hidden');
                document.getElementById('stopwatchSection').classList.remove('hidden');
                document.getElementById('tabStopwatchBtn').className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-emerald-500 text-slate-950';
                document.getElementById('tabTimerBtn').className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400';
            }
        }

        function updateTimerDisplay() {
            const m = String(Math.floor(timerTimeLeft / 60)).padStart(2, '0');
            const s = String(timerTimeLeft % 60).padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
            document.getElementById('activeTimerBadge').innerText = `${m}:${s}`;
        }

        function setTimerSeconds(sec) {
            if (isTimerRunning) toggleTimer();
            timerTimeLeft = sec;
            updateTimerDisplay();
        }

        function toggleTimer() {
            const btn = document.getElementById('startTimerBtn');
            const badge = document.getElementById('activeTimerBadge');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerText = 'Iniciar';
            } else {
                isTimerRunning = true;
                btn.innerText = 'Pausar';
                badge.classList.remove('hidden');
                timerInterval = setInterval(() => {
                    if (timerTimeLeft > 0) {
                        timerTimeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btn.innerText = 'Iniciar';
                        playAlarmSound();
                        alert('¡Tiempo de descanso finalizado!');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            if (isTimerRunning) toggleTimer();
            timerTimeLeft = 60;
            updateTimerDisplay();
            document.getElementById('activeTimerBadge').classList.add('hidden');
        }

        function startQuickTimer(sec) {
            setTimerSeconds(sec);
            if (!isTimerRunning) toggleTimer();
            document.getElementById('timerModal').classList.remove('hidden');
            switchTimerTab('timer');
        }

        function updateStopwatchDisplay() {
            const h = String(Math.floor(stopwatchTime / 3600)).padStart(2, '0');
            const m = String(Math.floor((stopwatchTime % 3600) / 60)).padStart(2, '0');
            const s = String(stopwatchTime % 60).padStart(2, '0');
            document.getElementById('stopwatchDisplay').innerText = `${h}:${m}:${s}`;
        }

        function toggleStopwatch() {
            const btn = document.getElementById('startStopwatchBtn');
            if (isStopwatchRunning) {
                clearInterval(stopwatchInterval);
                isStopwatchRunning = false;
                btn.innerText = 'Iniciar';
            } else {
                isStopwatchRunning = true;
                btn.innerText = 'Pausar';
                stopwatchInterval = setInterval(() => {
                    stopwatchTime++;
                    updateStopwatchDisplay();
                }, 1000);
            }
        }

        function resetStopwatch() {
            if (isStopwatchRunning) toggleStopwatch();
            stopwatchTime = 0;
            updateStopwatchDisplay();
        }

        function playAlarmSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e){}
        }
    </script>
</body>
</html>
